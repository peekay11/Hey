AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Hey Social Media App Backend
  SAM Template for AWS Serverless Architecture (af-south-1)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        POSTS_TABLE: !Ref PostsTable
        USERS_TABLE: !Ref UsersTable
        ALERTS_TABLE: !Ref AlertsTable
        MEDIA_BUCKET: !Ref MediaBucket
        COGNITO_CLIENT_ID: !Ref HeyUserPoolClient

Resources:
  # ==========================================
  # AUTHENTICATION (Cognito)
  # ==========================================
  HeyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: HeyUsers
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  HeyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: HeyWebClient
      UserPoolId: !Ref HeyUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ==========================================
  # DATABASES (DynamoDB)
  # ==========================================
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Hey-Posts
      AttributeDefinitions:
        - AttributeName: post_id
          AttributeType: S
        - AttributeName: author_id
          AttributeType: S
      KeySchema:
        - AttributeName: post_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Hey-Users
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Hey-Alerts
      AttributeDefinitions:
        - AttributeName: alert_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: alert_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # ==========================================
  # STORAGE & HOSTING (S3 & CloudFront)
  # ==========================================
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "hey-media-bucket-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*'] # In production, restrict this to your CloudFront domain

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "hey-frontend-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "${FrontendBucket.Arn}/*"

  FrontendCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt FrontendBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
  # ==========================================
  # API GATEWAY & LAMBDA FUNCTIONS
  # ==========================================
  
  # Auth Service (auth.py)
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:InitiateAuth
              Resource: !GetAtt HeyUserPool.Arn
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth/{action}
            Method: post
  
  # Posts Service (posts.py)
  PostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: posts.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        CreatePost:
          Type: Api
          Properties:
            Path: /posts
            Method: post
        GetFeed:
          Type: Api
          Properties:
            Path: /posts/feed
            Method: get

  # Profile Service (profile.py)
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            Path: /profile/{user_id}
            Method: get
        UpdateProfile:
          Type: Api
          Properties:
            Path: /profile/{user_id}
            Method: put

  # Discover Service (discover.py)
  DiscoverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: discover.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        GetTrending:
          Type: Api
          Properties:
            Path: /discover/trending
            Method: get

  # Saved Service (saved.py)
  SavedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: saved.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        GetSavedPosts:
          Type: Api
          Properties:
            Path: /saved/{user_id}
            Method: get

  # Alerts Service (alerts.py)
  AlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: alerts.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
      Events:
        GetAlerts:
          Type: Api
          Properties:
            Path: /alerts/{user_id}
            Method: get

Outputs:
  HeyApiEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  FrontendURL:
    Description: "CloudFront Distribution Domain Name for the React App"
    Value: !GetAtt FrontendCDN.DomainName
  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref HeyUserPool
  CognitoClientId:
    Description: "Cognito App Client ID"
    Value: !Ref HeyUserPoolClient
